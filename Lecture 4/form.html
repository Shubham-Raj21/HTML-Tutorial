<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Form</title>
</head>
<body>
  <form>
    <h1>Please schedule your trip</h1>
    <label for="username">Username: </label>
    <input 
    type="text" 
    id="username"
    name="username" 
    placeholder="Enter Your username"
    required>
    <br>
    <br>
    <label for="password">Password: </label>
    <input 
    type="password" 
    id="password" 
    name="username"
    placeholder="Enter your password"
    required
    minlength="6"
    maxlength="8"
    >
    <br>
    <br>
    <input type="submit">
  </form>
</body>
</html>
